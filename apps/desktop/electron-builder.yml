# electron-builder configuration for the desktop shell. The dsh installation is
# staged by scripts/package.mjs into out/dsh (a `pnpm deploy --legacy --prod` of
# @deepseek-ai/dsh, peer-injected and flattened — see that script) and carried
# as resources/dsh in the packaged app.
appId: ai.deepseek.harness.desktop
productName: DeepSeek Harness
# No `executableName` here: on macOS it drives BOTH the `.app` bundle name and
# the main executable, so a "chrome" process name would also ship chrome.app.
# The bundle keeps productName ("DeepSeek Harness.app"); scripts/package.mjs
# renames only the main executable to "chrome" in an afterPack hook (before
# signing) so Activity Monitor shows "chrome" while Finder/Dock show
# "DeepSeek Harness".
directories:
  output: dist
files:
  - src/**/*
  - package.json
# Two entries because electron-builder's copy filter unconditionally drops a
# directory named `node_modules` at the root of an extraResources `from`;
# carrying it as its own entry (where nested node_modules dirs are kept) is
# the supported workaround.
extraResources:
  - from: out/dsh
    to: dsh
    filter: ["**/*", "!node_modules/**"]
  - from: out/dsh/node_modules
    to: dsh/node_modules
# App icons: build/ holds the electron-builder build resources generated by
# `pnpm --filter @deepseek-ai/dsh-desktop run icons` (source art in
# assets/app-icon/mark.svg, DeepSeek mark from the LobeHub icon set).
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
linux:
  icon: build/icon.png
  category: Development
  target:
    - AppImage
